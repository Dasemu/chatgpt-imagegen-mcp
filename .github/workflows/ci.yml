name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # No linter/formatter is configured: typecheck is the only static check.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
